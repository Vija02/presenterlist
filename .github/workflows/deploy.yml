name: Deploy

# Builds the site and publishes it to GitHub Pages on every push to main.
# Also runs after the monthly Releases workflow, because its commit (made with
# GITHUB_TOKEN) doesn't trigger push workflows.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Releases]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned to a release Playwright supports for screenshot capture.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

      # Homepage screenshots: recaptured when the month, a product's website (or the product list)
      # or the capture script changes; otherwise reused from the cache. Other product edits don't
      # trigger a recapture. Old screenshots are kept for sites that fail.
      - id: shotkey
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "sites=$(grep -H -E '^(website|status):' src/data/products/*.yaml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - id: shots
        uses: actions/cache@v4
        with:
          path: public/screenshots
          key: screenshots-${{ steps.shotkey.outputs.month }}-${{ steps.shotkey.outputs.sites }}-${{ hashFiles('scripts/screenshots.ts') }}
          restore-keys: |
            screenshots-${{ steps.shotkey.outputs.month }}-
            screenshots-
      - name: Capture screenshots
        if: steps.shots.outputs.cache-hit != 'true'
        continue-on-error: true # a broken site shouldn't block the deploy
        timeout-minutes: 15
        run: |
          pnpm exec playwright install --with-deps chromium-headless-shell
          pnpm screenshots --force

      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
