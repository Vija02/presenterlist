name: Deploy

# Builds the site and publishes it to GitHub Pages on every push to main.
# Also runs after the monthly Releases workflow, because its commit (made with
# GITHUB_TOKEN) doesn't trigger push workflows.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Releases]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

      # Homepage screenshots: captured at most once a month per product, cached between deploys.
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: shots
        uses: actions/cache@v4
        with:
          path: public/screenshots
          key: screenshots-${{ steps.month.outputs.month }}-${{ hashFiles('src/data/products/*.yaml') }}
          restore-keys: |
            screenshots-${{ steps.month.outputs.month }}-
            screenshots-
      - name: Capture screenshots
        if: steps.shots.outputs.cache-hit != 'true'
        continue-on-error: true # a broken site shouldn't block the deploy
        run: |
          pnpm exec playwright install --with-deps chromium-headless-shell
          pnpm screenshots

      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
