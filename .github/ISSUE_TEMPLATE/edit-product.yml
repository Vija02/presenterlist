name: Suggest an edit
description: Report incorrect or missing information about a listed product
title: "Edit: "
labels: ["correction"]
body:
  - type: input
    id: product
    attributes: { label: Product slug, description: "The part of the URL after /software/" }
    validations: { required: true }
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: e.g. "Planning Center integration is supported since v7.2"
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Source, description: A public link that confirms the change }
    validations: { required: true }
