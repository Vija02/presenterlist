name: WordsLive
tagline: Free, open-source Windows projection software for lyrics, videos and presentations.
description: >-
  WordsLive is a free, open-source worship projection program for Windows,
  created as a successor to the discontinued Powerpraise and natively
  supporting its songs and portfolios. It presents songs from a central
  full-text-searchable library alongside videos, music, PowerPoint and
  LibreOffice presentations, PDF documents and images, and supports chord
  display with transposition. Songs can be imported from SongSelect,
  SongBeamer, OpenSong, OpenLyrics and ChordPro formats. The software is
  still labelled beta and is maintained by a small volunteer team.
website: http://wordslive.org/en/
logo: /logos/words-live.png
developer: WordsLive project
headquarters: Germany
founded: 2013
status: active
open_source: true
license: GPL-3.0
source_code_url: https://github.com/Boddlnagg/WordsLive
pricing:
  models: [free]
  free_trial: false
platforms: [windows]
deployment: [desktop]
features:
  songs:
    library: true
    import_other: true
    auto_import: partial
    chords: true
    backgrounds: partial
    ccli_reporting: partial
  slides:
    powerpoint: true
    pdf: partial
  media:
    video: true
    audio: true
    images: true
  sources:
    messages: partial
  multilingual:
    ui: true
    song_libraries: true
    bilingual_display: true
  connectivity:
    offline: true
    web_native: false
feature_notes:
  songs.import_other: Native Powerpraise songs and portfolios; songs can also be imported from SongBeamer, OpenSong, OpenLyrics and ChordPro files.
  songs.auto_import: Songs can be imported from SongSelect files or text copied to the clipboard; there is no direct online search.
  songs.chords: Chords can be shown with the lyrics and transposed automatically.
  songs.backgrounds: Background images for slides, songs or the whole service; background videos are experimental.
  songs.ccli_reporting: Songs can be stored with CCLI numbers, and a command opens CCLI Online Reporting in the browser for the selected songs.
  slides.powerpoint: PowerPoint (ppt, pptx) and OpenDocument (odp) presentations require Microsoft PowerPoint, the PowerPoint Viewer 2007 or LibreOffice/OpenOffice Impress to be installed.
  slides.pdf: PDF and XPS documents are supported (experimental).
  media.video: Additional formats are supported if VLC is installed and enabled.
  media.images: Photos can be compiled into an optionally timer-controlled slide show.
  sources.messages: An additional notification for the audience can be shown during a presentation (experimental).
  multilingual.ui: Interface in English and German.
  multilingual.bilingual_display: Songs can carry a translation, shown alongside the main language or on its own.
languages: [German, English]
docs_url: http://wordslive.org/en/manual/
sources:
