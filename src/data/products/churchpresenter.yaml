name: ChurchPresenter
tagline: Free, open-source desktop presenter for songs, scripture, slides, media and broadcast graphics.
description: >-
  ChurchPresenter is a free, open-source worship presentation application for
  Windows, macOS and Linux, built with Compose Multiplatform on the JVM. It
  presents songs, Bible verses, PowerPoint/Keynote/PDF slides, video, web pages,
  live captions and animated lower thirds to any number of outputs, including
  NDI, OMT, browser-source and DeckLink outputs. It also offers a stage monitor,
  phone and tablet remote control, Planning Center import, CCLI usage report
  export and integrations with OBS, Blackmagic ATEM and Bitfocus Companion.
  Companion iOS and Android apps can control the desktop schedule.
website: https://www.churchpresenter.org
