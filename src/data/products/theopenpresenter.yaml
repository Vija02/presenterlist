feature_notes:
  sources.interaction: Slido polls and Q&A can be shown through the Slido plugin.
  automation.ai: AI formats pasted lyrics into sections and slides.
  automation.plugins: Features are built as plugins on a modular architecture.
  connectivity.offline: Offline use is provided by the TheOpenPresenter Studio desktop app (stable on Windows, alpha on macOS).
  bible.builtin: Over a thousand freely licensed translations are available through the Beblia and Free Use Bible API catalogues.
  slides.animations: PowerPoint imports keep their slideshow data so animations play click by click.
  software_integrations.planning_center: Setlists can be imported from Planning Center.
  software_integrations.churchsuite: Setlists can be imported from ChurchSuite.
  tv_output.android_tv: TheOpenPresenter TV app for Android TV and Apple TV; a Fire TV (Vega OS) version is also built.
  songs.auto_import: Songs can be pulled from MyWorshipList.
