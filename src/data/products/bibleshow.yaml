name: BibleShow
tagline: Free Windows software for displaying Bible verses, with NDI output and up to four screens.
description: >-
  BibleShow is a free Windows application dedicated to presenting Bible
  verses on projectors, TVs and other displays. It shows up to four Bible
  versions in parallel, manages downloadable Bible modules (180+) and themes,
  supports program lists and automatic verse playback, and can output to up
  to four screens and over NDI. It does not handle songs or general media
  presentations. The latest version, 5.4, dates from 2020; the same author
  offers a separate macOS app, BibleCast.
website: https://www.bibleshow.net
logo: /logos/bibleshow.png
developer: BibleShow
status: maintenance
status_note: No updates since BibleShow 5.4 (installer dated 10 February 2020; site last updated December 2020). It remains available for download; no official discontinuation has been announced.
open_source: false
pricing:
  models: [free, donation]
  free_trial: false
platforms: [windows]
deployment: [desktop]
features:
  songs: false
  bible:
    builtin: true
  slides: false
  media:
    images: true
  sources:
    camera: partial
  multilingual:
    ui: true
    bible_translations: true
    side_by_side: true
    non_latin: true
  broadcast_video:
    ndi: true
  outputs:
    multiple: true
    stage_display: true
    lower_thirds: true
  connectivity:
    offline: true
feature_notes:
  songs: Bible-only presenter; songs and general presentations are not handled.
  bible.builtin: Ships with the King James Version; 180+ free Bible modules in over 60 languages can be downloaded from within the app.
  media.images: Background images with adjustable effects behind the scripture text.
  sources.camera: An NDI source can be used as the background; no direct capture-card input is described.
  multilingual.ui: The menu language can be changed (the site itself is in English and Romanian).
  multilingual.side_by_side: Up to 4 versions in parallel on the main screen and up to 7 across all displays.
  multilingual.non_latin: Full support for right-to-left languages such as Hebrew and Arabic.
  broadcast_video.ndi: NewTek NDI output (one per instance, with alpha channel) and NDI input as background.
  outputs.multiple: Up to four independently configured displays, each to a window, NDI or data (XML/PNG) output.
  outputs.stage_display: A stage monitor can mirror the main display or use its own theme.
  outputs.lower_thirds: Display windows can cover part of the screen and NDI output carries an alpha channel.
sources:
