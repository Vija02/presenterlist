name: ZionWorx
tagline: Subscription-based Windows worship presentation software with NDI outputs and a remote app.
description: >-
  ZionWorx is a Windows worship presentation program developed by Jubilate
  Software Ltd in Coventry, England. It presents songs, Bible passages from
  BibleGateway.com, PowerPoint files, images and video, and supports multiple
  independent NDI outputs and a mobile remote app. Version 4 is the current
  release; version 5 is in public beta with additions such as a stage display,
  SongSelect import, CCLI reporting and a web remote. Pricing is tiered by
  country income level, and it is free in lower-income and persecuted-church
  countries.
website: https://zionworx.com
logo: /logos/zionworx.png
developer: Jubilate Software Ltd
headquarters: United Kingdom
founded: 2002
status: active
open_source: false
pricing:
  models: [subscription]
  free_trial: true
  starting_price: From £9.50/month
  pricing_url: https://zionworx.com/pricing/
  notes: >-
    Purchasing-power-parity pricing - full price in high-income countries, 50% off
    in mid-income countries, free in low-income countries and countries on the
    Open Doors World Watch List. A licence covers installation on multiple PCs
    used by the team.
platforms: [windows]
deployment: [desktop]
output_note: Runs on Mac hardware only via Parallels or Boot Camp; no native macOS version is planned.
features:
  songs:
    library: true
    auto_import: partial
    backgrounds: true
    ccli_reporting: partial
  bible:
    builtin: true
    licensed: true
  slides:
    powerpoint: true
  media:
    video: true
    images: true
  sources:
    camera: true
  multilingual:
    bible_translations: true
  outputs:
    multiple: true
    stage_display: partial
  broadcast_video:
    ndi: true
  connectivity:
    remote_control: true
    web_native: false
feature_notes:
  bible.builtin: 230+ Bibles in over 70 languages are accessed through a BibleGateway.com connection.
  bible.licensed: Translations available on BibleGateway.com can be used through the integration.
  slides.powerpoint: Native PowerPoint integration; v5 reworks it for reliability. No Keynote or Google Slides support is mentioned.
  songs.backgrounds: Motion backgrounds behind lyrics are supported.
  sources.camera: Camera input is supported (a Windows camera app is offered); improved in v5.
  songs.ccli_reporting: CCLI song reporting is new in v5, which is in beta until its release from December 2026.
  outputs.multiple: Multiple outputs with dynamic text pagination; v5 adds synchronised outputs run by one operator.
  outputs.stage_display: A stage display is new in v5, which is in beta until its release from December 2026.
  connectivity.remote_control: ZionWorx Remote app for Android and iOS; v5 adds a web remote reached via QR code.
  broadcast_video.ndi: Multiple independent live NDI outputs.
  songs.auto_import: One-click SongSelect lyrics import is new in v5, which is in beta until its release from December 2026.
release_notes_url: https://download.zionworx.com/zionworx/zw-release-notes-v4.txt
