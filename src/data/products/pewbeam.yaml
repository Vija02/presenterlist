name: Pewbeam
tagline: AI presentation app that listens to the sermon and puts detected Bible verses on screen.
description: >-
  Pewbeam is a desktop presentation app for churches that transcribes the
  sermon in real time and automatically detects and displays Bible verses,
  including paraphrased or unreferenced quotations. Verses are shown through a
  theme designer with auto and manual modes, a queue and a preview/live
  workflow, and can be sent to HDMI screens or over NDI. Paid plans add
  unlimited transcription, AI slide generation, more outputs and AI sermon
  notes. It was founded in Nigeria in 2025.
website: https://pewbeam.com
logo: /logos/pewbeam.png
developer: Pewbeam
headquarters: Nigeria
founded: 2025
status: active
open_source: false
pricing:
  models: [freemium, subscription]
  free_trial: false
  starting_price: "From $12/month billed annually ($14 monthly)"
  pricing_url: https://pewbeam.com/pricing
  notes: Free Explorer tier with 60 one-time transcription minutes, a watermark and up to 2 outputs; Plus and Core tiers add unlimited transcription, more outputs and devices.
platforms: [windows, macos]
deployment: [desktop]
features:
  songs:
    backgrounds: addon
  bible:
    builtin: true
    licensed: true
  slides:
    powerpoint: partial
  sources:
    messages: true
  multilingual:
    bible_translations: addon
  automation:
    api: partial
    ai: true
  outputs:
    multiple: true
    lower_thirds: true
  broadcast_video:
    ndi: true
  connectivity:
    offline: partial
feature_notes:
  songs.backgrounds: Video and GIF motion backgrounds for themes and slides need the Plus or Core plan.
  bible.builtin: Verses are detected automatically from live speech; 4 Bible translations on the free tier, 20 on paid plans.
  bible.licensed: KJV, NKJV, NIV, NLT, ESV and NASB are bundled.
  slides.powerpoint: Text from PowerPoint and Word files can be imported into the built-in slide editor, and decks can be exported as PPTX or PDF.
  sources.messages: Alert banners, including scrolling and looping alerts, can be sent to every screen.
  multilingual.bible_translations: Paid plans can install downloadable translations such as Spanish, French, Hausa, Igbo and Yoruba, plus language packs for non-English sermon detection.
  automation.api: Local OSC and HTTP endpoints for broadcast integration; the docs say slide navigation commands are still being wired through.
  automation.ai: Listens to the sermon and detects Bible references, including paraphrases; also generates slides, sermon excerpts and sermon notes.
  outputs.multiple: Up to 2, 4 or 6 display outputs depending on plan, each with its own theme.
  outputs.lower_thirds: Lower-third themes and NDI output with alpha transparency; creating new transparent themes needs the Core plan.
  broadcast_video.ndi: NDI output at 720p, 1080p or 4K with alpha transparency.
  connectivity.offline: Bible search and display work offline; offline transcription is available on Apple Silicon Macs on paid plans, otherwise transcription needs a connection.
