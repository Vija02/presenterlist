feature_notes:
  songs.import_other: Separate importers for PowerPraise, PraiseMaster and PraiseBox songs, plus lyrics import from PowerPoint and CSV.
  songs.auto_import: Songs (with chords) can be imported directly from CCLI SongSelect while the licence is entitled to updates.
  songs.chords: Songs can be projected and printed with chords, with transposition.
  songs.backgrounds: Images and videos can be used as song backgrounds.
  songs.ccli_reporting: Optional automatic reporting to CCLI, added in version 6.0, available while entitled to updates; VG Musikedition reports can be exported too.
  bible.builtin: Elberfelder 1905 is included, and free translations can be imported from Zefania XML.
  bible.licensed: Modern German translations such as Luther 2017, Schlachter 2000 and BasisBibel are sold separately (€19-39 each).
  slides.powerpoint: PowerPoint and LibreOffice files can be added to the schedule; requires PowerPoint, the PowerPoint Viewer or LibreOffice.
  media.youtube: YouTube videos can be shown, including URLs with a start time.
  sources.camera: Live video from a camera or capture device can be shown behind text.
  sources.web: Web pages can be added to the schedule and displayed.
  sources.timers: Countdowns and stopwatches, also shown on the stage view.
  sources.messages: Spontaneous messages to the congregation can be shown over the presentation.
  multilingual.ui: Interface in German and English.
  multilingual.bilingual_display: Songs can hold up to 4 languages, shown together on screen.
  multilingual.side_by_side: Up to two Bible translations can be shown at once.
  multilingual.non_latin: Unicode text such as Cyrillic is supported; the changelog notes right-to-left output (e.g. Arabic) is not yet fully correct.
  hardware.midi: Control via MIDI and OSC.
  automation.api: Remote control over the network via OSC; no HTTP or WebSocket API is documented.
  automation.scripting: SongBeamer Script macros can be run from menus or added to the schedule.
  outputs.multiple: A presentation can also be shown on a third monitor (beta).
  outputs.lower_thirds: NDI output has its own formatting and an optional background colour for keying.
  broadcast_video.ndi: Text output to OBS Studio and other software via NDI or a text file.
  connectivity.remote_control: SongBeamer Remote app for iPhone and iPad.
languages: [German, English]
