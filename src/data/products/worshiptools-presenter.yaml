feature_notes:
  songs.import_other: Lyrics can be imported from EasyWorship 7, OpenLP, ProPresenter 6/7, MediaShout (Windows) and others.
  songs.auto_import: Lyrics, chords and lyric videos can be imported from CCLI SongSelect and Loop Community on all tiers.
  songs.chords: ChordPro chords from SongSelect or Loop Community appear on the stage display and can be transposed; requires SongSelect Premium.
  songs.backgrounds: Free and Pro include one motion graphic per month; Pro Plus has unlimited access to 500+ motion loops.
  bible.builtin: 45+ free translations in many languages are included on all tiers; custom XML Bibles can also be imported.
  bible.licensed: Translations such as NIV, ESV, NKJV and NLT can be purchased from the WorshipTools account page.
  slides.keynote: Keynote import is macOS only and requires Keynote to be installed.
  slides.google_slides: Google Slides presentations can be imported and re-synced after changes.
  slides.animations: PowerPoint is converted to static images; the "Launch with PowerPoint" option (Windows only) keeps animations and transitions.
  media.youtube: YouTube and Vimeo videos can be played as Web Video items (needs internet).
  sources.camera: A camera or capture feed can be used as the background of any item to overlay lyrics or scripture (documented for the legacy version).
  sources.web: Web Page service items show most external websites.
  sources.messages: Alerts can be sent to the audience screen and the stage display.
  multilingual.ui: Interface available in English, German, Spanish, Ukrainian, Italian, Korean, Portuguese and French.
  software_integrations.planning_center: Planning Center Services plans can be imported and re-synced (documented for the legacy version).
  software_integrations.worshiptools: Services from WorshipTools Planning and charts from WorshipTools Charts sync with Presenter.
  hardware.midi: MIDI mapping to control service items, over USB/5-pin or a network session; MIDI Out is also listed.
  outputs.multiple: Requires a Pro plan; unlimited outputs, each with its own layout (audience, stage, livestream lyrics).
  outputs.stage_display: Requires a Pro plan; companion stage display app for iPhone, iPad and Android.
  outputs.lower_thirds: Lower-third lyrics templates are offered for livestream outputs.
  broadcast_video.ndi: Outputs can be sent over the network as NDI.
  connectivity.remote_control: Requires a Pro plan; remote app for iPhone, iPad and Android.
  connectivity.collaboration: Multiple users can work on presentations from one account; simultaneous Presenter sessions require Pro Plus.
  connectivity.offline: Offline mode runs existing and new services; YouTube and SongSelect import need a connection.
