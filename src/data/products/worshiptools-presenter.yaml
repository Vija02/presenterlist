name: WorshipTools Presenter
tagline: Free church presentation app with cloud sync and paid tiers for multi-screen features.
description: >-
  Presenter is the church presentation app in the WorshipTools suite, which
  was previously known as Worship Extreme. It runs on Windows and macOS,
  syncs songs, media and cue lists across computers through the cloud, and
  runs locally without an internet connection once synced. The free tier
  includes lyrics, built-in Bibles and SongSelect import with unlimited
  installs; stage display, the mobile remote and multiple output screens
  require a paid Pro plan.
website: https://worshiptools.com/presenter
logo: /logos/worshiptools-presenter.svg
developer: WorshipTools (Blue Circle Lab LLC)
status: active
open_source: false
pricing:
  models: [freemium, subscription]
  free_trial: false
  pricing_url: https://www.worshiptools.com/pricing
  notes: >-
    Free forever tier with unlimited installs and no watermark. Pro adds stage
    display, mobile remote and multiple outputs; Pro Plus adds unlimited
    motion graphics and templates and simultaneous Presenter sessions. Prices
    were not shown on the pricing page at the time of verification.
