feature_notes:
  songs.import_other: Song databases from EasyWorship 6/7 can be imported directly; other programs can export lyrics for import.
  songs.auto_import: Lyrics can be imported from SongSelect, Hymnbase or MultiTracks.com.
  songs.chords: Chord progressions come in from MultiTracks.com and can be shown on the confidence monitor.
  songs.backgrounds: 1,000+ free motions and stills on every plan; Pro and Partner tiers add larger media libraries.
  bible.builtin: 60+ Bible versions are included on every plan.
  slides.powerpoint: PowerPoint files can be imported; on Windows control can also be handed over to PowerPoint.
  slides.keynote: On a Mac with Keynote installed, Keynote files are imported as static image slideshows.
  multilingual.ui: The interface is English only, though slide text can be in other languages.
  hardware.midi: MIDI in/out, including MIDI over Wi-Fi with tools like Ableton Live.
  hardware.stream_deck: Elgato Stream Deck is supported in Proclaim 3.2 and later.
  automation.api: The vendor's ProPresenter comparison names scripting/API control as something ProPresenter has and Proclaim does not focus on.
  automation.scripting: The vendor's ProPresenter comparison names scripting/API control as something ProPresenter has and Proclaim does not focus on.
  outputs.multiple: Up to 8 virtual screens can send different content to lobby, overflow, nursery and livestream.
  outputs.stage_display: Configurable confidence monitor outputs with stage messages; multiple confidence monitors are supported.
  outputs.lower_thirds: Alpha keying is supported, and picture-in-picture shows slides over a transparent background.
  streaming.rtmp: For YouTube or Facebook Live the vendor recommends sending NDI or SDI output to a tool such as OBS.
  streaming.recording: Built-in recording is aimed at producing and publishing sermon podcasts.
  tv_output.apple_tv: A free Digital Signage app runs on Apple TV, Fire TV Stick or any web browser for lobby screens.
  tv_output.fire_tv: A free Digital Signage app runs on Apple TV, Fire TV Stick or any web browser for lobby screens.
  software_integrations.planning_center: Service plans can be imported from Planning Center Services (requires edit permissions).
  connectivity.collaboration: Team members edit presentations together with real-time cloud sync; web and mobile editing requires Proclaim Pro.
  connectivity.offline: Schedules are stored locally so going live does not require internet; some features (signals, importing third-party content, embedded content) need a connection.
  connectivity.web_native: Presentations can be created and edited in a browser with Proclaim Pro, but presenting requires the desktop app.
  connectivity.remote_control: Remote control apps for iOS and Android are included in every plan.
