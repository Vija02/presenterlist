name: Proclaim
tagline: Cloud-synced church presentation software from Logos (formerly Faithlife).
description: >-
  Proclaim is a church presentation application from Logos (formerly
  Faithlife). Presentations are stored in the cloud and can be edited by
  multiple team members from a browser or mobile app, then presented from a
  Windows or Mac computer, where schedules are kept locally for offline use.
  It includes scripture lookup, SongSelect import, CCLI reporting, NDI and SDI
  output, MIDI, confidence monitors and live streaming. One subscription covers
  unlimited installs and collaborators.
website: https://proclaim.logos.com/
logo: /logos/proclaim.png
developer: Logos (formerly Faithlife)
headquarters: United States
status: active
open_source: false
pricing:
  models: [subscription]
  free_trial: true
  starting_price: $269.99/year
  pricing_url: https://proclaim.logos.com/pricing
  notes: >-
    One subscription per church covers unlimited installs and collaborators;
    media libraries are available as higher tiers. A 14-day free trial is
    offered without a credit card. Plans are Proclaim ($269.99/year), Pro
    ($399.99/year) and Pro + Partner Media ($999.99/year).
platforms: [windows, macos, web, ios, android]
deployment: [desktop, cloud]
output_note: >-
  Presenting runs in the Windows or Mac desktop app; the web and mobile apps
  are for editing and remote control. A free signage app runs on Fire TV,
  Apple TV or a web browser.
