  web_content: YouTube playback.
  live_video_input: Phones, tablets or webcams can be used as live video sources.
  multiple_outputs: Unlimited Frontend and Monitor outputs plus custom outputs.
  collaboration: Lyrics, videos and images can be shared between locations within one organisation.
