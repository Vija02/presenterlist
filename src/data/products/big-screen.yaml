name: Big Screen
tagline: Browser-based church presentation software with themes, timers and unlimited outputs.
description: >-
  Big Screen is a web-based church presentation application from Launch
  Interactive that runs in major browsers on Windows, macOS and Linux. Songs,
  scriptures, images and videos are managed in one place and presented with
  custom themes, looping video backgrounds and YouTube playback. It provides
  unlimited front-of-house and monitor outputs, with a monitor display showing a
  clock, countdown timers and upcoming lyrics, and is designed to keep working
  without an internet connection.
website: https://bigscreen.show
developer: Launch Interactive
headquarters: Australia
status: active
open_source: false
