name: Quelea
tagline: Free, open-source Java-based projection software for churches.
description: >-
  Quelea is a free, open-source church projection program written in Java
  (JavaFX). It displays songs, Bible passages, images, videos, PDFs, websites
  and PowerPoint presentations from an order of service, and includes a stage
  view with chords, notices, countdown timers and audio recording. Lyrics can
  be pushed to phones over the local network, and a mobile remote lets
  another device control the projection. The latest stable release is 2024.0
  (February 2024); development activity in the repository has continued since.
website: https://quelea.org
logo: /logos/quelea.png
developer: Quelea project (volunteer community)
status: maintenance
status_note: Last stable release 2024.0 on 2 February 2024; occasional commits were still made in 2026.
open_source: true
license: GPL-3.0-or-later
source_code_url: https://github.com/quelea-projection/Quelea
pricing:
  models: [free]
  free_trial: false
platforms: [windows, macos, linux]
deployment: [desktop]
output_note: Mobile Lyrics can be viewed in any web browser on the local network.
features:
  songs:
    library: true
    import_other: true
    import_text: true
    auto_import: partial
    chords: true
    backgrounds: true
  bible:
    builtin: true
  slides:
    powerpoint: true
    pdf: true
    animations: partial
  media:
    video: true
    audio: true
    images: true
    youtube: true
  sources:
    web: true
    timers: true
    messages: true
  multilingual:
    ui: true
    song_libraries: true
    bilingual_display: true
  software_integrations:
    planning_center: true
  automation:
    api: partial
  outputs:
    stage_display: true
    web_output: partial
  connectivity:
    offline: true
    remote_control: true
feature_notes:
  songs.import_other: Imports from EasyWorship, ProPresenter, MediaShout, OpenLP, OpenSong, SongBeamer, VideoPsalm, ZionWorx, SongPro, Sunday Plus, EasySlides and more, plus Elvanto plans.
  songs.import_text: Plain-text song files (with optional ChordPro chords) can be imported, and lyrics can be typed or pasted into the song editor.
  songs.auto_import: Imports downloaded SongSelect USR files; no direct online SongSelect connection.
  songs.chords: Songs can hold chord lines, which can be transposed, printed and shown on the stage view.
  songs.backgrounds: Themes can use a video as the background.
  bible.builtin: KJV, ASV, RSV and NET Bibles ship with Quelea; further Bibles use the Zefania XML format.
  slides.powerpoint: Displays PowerPoint and PDF files, optionally driving an installed PowerPoint on Windows.
  slides.animations: Animations only play when Quelea is set to use an installed PowerPoint (Windows).
  sources.web: Websites can be displayed, with documented limitations.
  sources.messages: Notices scroll across the projected display a set number of times.
  multilingual.ui: The interface is translated into over 20 languages.
  multilingual.bilingual_display: A song translation can be shown together with the default lyrics.
  software_integrations.planning_center: Imports schedules from Planning Center Online.
  automation.api: The Mobile Remote HTTP server exposes endpoints (next, previous, lyrics, schedule, search) but is not documented as a public API.
  outputs.web_output: Mobile Lyrics shows the current lyrics as a web page on the local network.
  connectivity.remote_control: Web-based Mobile Remote and a Quelea Mobile Remote app.
languages: [English, German, Spanish, Swedish, Czech, Hungarian, Norwegian, Dutch, Lithuanian, Portuguese]
