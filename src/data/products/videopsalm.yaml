name: VideoPsalm
tagline: Free Windows presentation software for lyrics, Bible verses and media.
description: >-
  VideoPsalm is a free church presentation program for Windows. It presents
  song lyrics (with chords and transposition), Bible verses from a large
  catalogue of downloadable translations, images, videos, PowerPoint and PDF
  files, web pages and timers, organised into an agenda. It can run portably
  from a USB drive and store data in a cloud-synced folder. It is freeware;
  no source code license is published.
website: https://videopsalm.org
logo: /logos/videopsalm.png
developer: VideoPsalm
founded: 2011
status: active
open_source: false
pricing:
  models: [free]
  free_trial: false
platforms: [windows]
deployment: [desktop]
features:
  songs:
    library: true
    import_other: true
    auto_import: partial
    chords: true
    backgrounds: true
    ccli_reporting: true
  bible:
    builtin: true
  slides:
    powerpoint: true
    keynote: false
    pdf: true
    animations: true
  media:
    video: true
    audio: true
    images: true
    youtube: true
  sources:
    camera: true
    web: true
    timers: true
    messages: true
  multilingual:
    ui: true
    song_libraries: true
    bible_translations: true
    bilingual_display: true
    side_by_side: true
  outputs:
    stage_display: true
  connectivity:
