    offline: true
    remote_control: false
feature_notes:
  songs.import_other: Described as compatible with OpenSong and ProPresenter song files.
  songs.auto_import: Downloaded SongSelect .usr song files can be added to the agenda; songs can also be fetched from an expandable online song library.
  songs.chords: Chords over lyrics with transposition and capo; ChordPro notation is supported.
  songs.backgrounds: Video loops can be played under lyrics.
  bible.builtin: Over 3,000 Bible translations in 1,900+ languages can be downloaded and added.
  slides.keynote: Windows-only; PowerPoint, PDF, Word and LibreOffice documents are listed but not Keynote.
  slides.animations: Animations inside PowerPoint slides can be stepped through.
  sources.camera: A live video feed can be used as a lyrics background.
  sources.timers: Clock, countdown and stopwatch.
  multilingual.ui: The interface is translatable and available in 28+ languages.
  multilingual.side_by_side: Bilingual display of songs and Bible verses on one slide.
  connectivity.remote_control: A Wi-Fi remote and mobile app are listed as "coming soon" on the features page.
  connectivity.cloud_sync: Data can be kept in a third-party cloud folder (pCloud, Dropbox, OneDrive); there is no built-in sync service.
