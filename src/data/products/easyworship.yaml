name: EasyWorship
tagline: Subscription worship presentation software for Windows and Mac.
description: >-
  EasyWorship is a church presentation application for lyrics, scripture,
  sermon slides and media. It includes a built-in Bible with over 100
  translations, CCLI SongSelect import with automatic usage reporting, and NDI
  output for livestreaming. Version 8, released in April 2026, added native
  support for Apple Silicon Macs alongside Windows. It is sold as a
  subscription, with a higher tier that adds a stock media library.
website: https://www.easyworship.com/
developer: EasyWorship
headquarters: United States
status: active
open_source: false
pricing:
  models: [subscription]
  free_trial: true
  starting_price: $17.50/month or $210/year (Basic)
  pricing_url: https://www.easyworship.com/pricing
  notes: >-
    Basic and Premium plans; Premium adds a library of backgrounds, countdowns
    and an online media designer. Advertised prices are "starting at" and vary
    by average weekly attendance. Each plan covers one campus. 30-day free trial.
platforms: [windows, macos]
deployment: [desktop]
features:
  songs:
    library: true
    auto_import: true
    backgrounds: true
    ccli_reporting: true
  bible:
    builtin: true
    licensed: addon
  slides:
    powerpoint: true
    keynote: false
  media:
    video: true
    audio: true
    images: true
    youtube: true
  sources:
    camera: true
    web: true
    timers: true
    messages: true
  multilingual:
    bible_translations: true
  hardware:
    midi: true
    stream_deck: true
  outputs:
    multiple: true
    stage_display: true
    lower_thirds: true
  broadcast_video:
    ndi: true
  connectivity:
    remote_control: true
    web_native: false
feature_notes:
  songs.auto_import: SongSelect integration (added in 7.4) imports pre-formatted lyrics into the song library.
  songs.ccli_reporting: SongSelect activity is auto-reported to CCLI (since 7.4.1).
  songs.backgrounds: The Premium plan adds a library of motion backgrounds and countdowns.
  bible.builtin: 100+ translations in 32 languages; a number of free Bibles are included.
  bible.licensed: Copyrighted translations are sold as Bible plug-ins.
  slides.powerpoint: PowerPoint files can be imported into the presentations library.
  slides.keynote: No direct Keynote import; slides must be exported as images first.
  media.youtube: A built-in web browser (added in 7.4) can show live web pages and YouTube or Vimeo video.
  sources.web: A built-in web browser (added in 7.4) can show live web pages.
  sources.camera: Capture cards such as Blackmagic, Magewell and AJA are supported, and NDI sources can be used as live inputs.
  broadcast_video.ndi: NDI can be used as a live output and as a capture source, including NDI HX3.
  hardware.midi: MIDI input and output for cues (e.g. Ableton Live) and MIDI Sync for controlling schedules across computers.
  hardware.stream_deck: Stream Deck and Bitfocus Companion plug-ins trigger cues.
  outputs.multiple: Alternate outputs for additional displays such as in-house or livestream screens (added in 7.3).
  outputs.lower_thirds: Output supports an alpha channel, with key/fill via Blackmagic ATEM, and there is a lower-thirds media category.
  connectivity.remote_control: Free EasyWorship Remote app for iOS and Android.
