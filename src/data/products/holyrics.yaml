feature_notes:
  songs.import_other: Lyrics can be imported from other sources, including PowerPoint files.
  songs.auto_import: Built-in web search of the holyrics.com lyrics database, with many songs pre-formatted for projection.
  songs.chords: Chords and comments can be shown on the return (stage) monitor.
  songs.backgrounds: Themes can use videos as backgrounds, with optional BPM-synced playback speed.
  bible.licensed: Translations are offered through partnerships with Bible publishers as well as public-domain versions.
  slides.powerpoint: .ppt/.pptx files can be run from the program on Windows only, with Microsoft PowerPoint installed.
  media.video: Audio and video play through the integrated VLC player.
  media.youtube: The FAQ states YouTube videos cannot be played in the program because of YouTube policy.
  sources.camera: Webcams and IP cameras can be played through the VLC player, though the FAQ warns of noticeable delay.
  sources.web: A website can be opened full screen on the projection screen (Windows only, requires Chrome or Edge).
  sources.messages: Alerts at the top or bottom of the screen, custom messages and a communication panel for the stage screen.
  sources.interaction: Q&A, polls and raffles via a Telegram chatbot are part of the paid online plans; a built-in multiple-choice quiz is also available.
  multilingual.bilingual_display: Song slides can carry translations, shown on separate screens or together on one screen.
  multilingual.side_by_side: Up to 3 Bible versions can be shown simultaneously, with verse mapping across languages.
  multilingual.non_latin: Settings for non-Latin scripts including Arabic, Hebrew, Cyrillic, Devanagari, Han and Hangul.
  hardware.midi: MIDI input can trigger program actions, e.g. advancing slides from a multitrack playback.
  hardware.dmx: No direct DMX output; API items and triggers can send commands to the Lumikit lighting software.
  automation.api: Local HTTP API server with token authentication; access from the internet requires the Advanced plan.
  automation.scripting: JavaScript (ECMAScript 5.1) scripts, startup code, system variables and custom API routes.
  automation.webhooks: Triggers run actions on program events, sending HTTP, WebSocket, TCP/UDP, OSC or MIDI messages and controlling OBS, vMix and PTZ cameras.
  outputs.stage_display: Return monitors with their own settings and monitor-only messages and alerts.
  outputs.lower_thirds: NDI outputs can use a transparent background for keying over video.
  outputs.web_output: The Holyrics plugin runs an HTTP server so the projection can be viewed in browsers or added as a source in streaming software.
  broadcast_video.ndi: Multiple NDI outputs with configurable resolution, frame rate and theme.
  streaming.rtmp: The FAQ states the program does not stream itself but works alongside streaming software such as OBS.
  connectivity.cloud_sync: All data and media can be synchronised between computers through Google Drive (settings are not synced).
  connectivity.remote_control: Holyrics mobile app for Android and iOS (iOS app is a one-time US$0.99 purchase).
