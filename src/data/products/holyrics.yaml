name: Holyrics
tagline: Free Brazilian worship presentation software for lyrics and Bible verses, with optional online plans.
description: >-
  Holyrics is a free church presentation program for song lyrics, Bible
  verses, audio and video, developed in Brazil and widely used by
  Portuguese-speaking churches. It includes playlists for each service, song
  history and reports, team scheduling, return (stage) monitors with their own
  messages, and a mobile app for remote control. Low-cost optional monthly
  plans add online sharing with the mobile app, Telegram audience
  interaction and internet access to the program's API.
website: https://holyrics.com.br/
logo: /logos/holyrics.png
developer: Lima Giran Ltda.
headquarters: Brazil
founded: 2016
status: active
open_source: false
pricing:
  models: [freemium, subscription]
  free_trial: false
  starting_price: Free; optional plans from US$2/month
  pricing_url: https://holyrics.com.br/holyrics_plan.html
  notes: >-
    The desktop program is free. Optional Holyrics Plan subscriptions: Basic
    (US$2/month, online sharing and Telegram features), Advanced (US$3/month,
    adds the online API) and Advanced + Worshipwide (US$7/month, adds a media
    gallery).
platforms: [windows, macos, linux]
deployment: [desktop]
