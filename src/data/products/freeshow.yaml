feature_notes:
  songs.import_other: Imports from ProPresenter, EasyWorship, VideoPsalm, OpenLP/OpenLyrics, OpenSong, MediaShout, Quelea, SoftProjector, SongBeamer, EasySlides and VerseVIEW, plus ChordPro, CSV and Word.
  songs.import_text: Lyrics can be pasted into the Quick lyrics box when creating a show.
  songs.auto_import: No SongSelect integration because CCLI discontinued its API; song lyrics can be pulled from Planning Center plans.
  songs.chords: Chords can be added to song text and shown on the stage display.
  songs.ccli_reporting: Song usage can be logged to a file and exported; reports are not submitted to CCLI automatically.
  bible.builtin: Over 200 versions can be downloaded through API.Bible (online), or Zefania, OSIS, Beblia and OpenSong files imported.
  bible.licensed: Some copyrighted versions are available through API.Bible; the docs do not list NIV or ESV.
  slides.powerpoint: PowerPoint and PDF files are imported as slides; a deprecated controller mode drives an installed PowerPoint or Keynote.
  slides.keynote: Keynote is only supported through the deprecated controller mode, which needs Keynote installed on macOS.
  slides.canva: A Canva connection (OAuth) lets designs be browsed and used from FreeShow's content library.
  slides.animations: Original slide animations only play in the deprecated PowerPoint/Keynote controller mode; FreeShow has its own transitions and item animations.
  media.youtube: YouTube and Vimeo videos can be played by pasting a link.
  sources.camera: Cameras, screens and windows can be shown from the media drawer.
  sources.messages: Any number of overlays can be layered over slides for announcements and messages.
  sources.interaction: Interaction slides (join, question, chart, leaderboard) let the audience take part from their phones.
  multilingual.ui: The interface is translated into about 30 languages.
  multilingual.bilingual_display: Songs can carry translations that are shown together with the original lyrics.
  multilingual.side_by_side: Scripture collections show several versions at the same time.
  multilingual.non_latin: Text items have a right-to-left option, and the interface has an Arabic translation.
  software_integrations.planning_center: Downloads upcoming Planning Center service plans; ChurchApps (B1.church) and OnStage are also supported.
  hardware.midi: Can receive MIDI to trigger actions and slides and send MIDI on slide changes.
  hardware.stream_deck: Bitfocus Companion is supported for Stream Deck control.
  automation.api: WebSocket and REST API, enabled in Connections settings.
  automation.webhooks: Emitter templates send HTTP, OSC or MIDI messages from slides and actions.
  automation.ai: Optional AI features include speech-to-text transcription with automatic scripture detection and an LLM assistant (local or cloud models).
  outputs.lower_thirds: Outputs can have their own styles and an alpha key output for keying lyrics over video.
  outputs.web_output: OutputShow serves an output as a web page on the local network.
  broadcast_video.sdi: Blackmagic DeckLink and UltraStudio outputs are supported.
  streaming.rtmp: Outputs can be streamed over RTMP (YouTube, Twitch, Facebook Live) or WebRTC/WHIP.
  streaming.recording: Outputs and captured screens can be recorded to a file.
  connectivity.cloud_sync: The library can be synced across computers through cloud sync (e.g. Google Drive or ChurchApps).
