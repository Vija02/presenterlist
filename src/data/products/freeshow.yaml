name: FreeShow
tagline: Free, open-source presentation software for lyrics, scripture and media.
description: >-
  FreeShow is a free, open-source presentation program built with Electron and
  maintained under the ChurchApps / Live Church Solutions non-profit umbrella.
  It manages songs, scripture, media, overlays and countdown timers in projects,
  and can drive several outputs with different styles (for example in-room,
  livestream and stage). Phones and tablets on the local network can control
  the show or act as a stage display through companion web apps, and outputs
  can be sent over NDI.
website: https://freeshow.app
logo: /logos/freeshow.png
developer: ChurchApps (Live Church Solutions)
headquarters: Norway
founded: 2021
status: active
open_source: true
license: GPL-3.0-only
