feature_notes:
  bible.builtin: 130+ translations in 25+ languages are available in the Bible module.
  bible.licensed: Some translations are sold separately.
  slides.powerpoint: Since 21.2, .pptx files can be imported natively as editable presentations without PowerPoint installed.
  slides.keynote: Keynote files are not converted; on Mac they are triggered from a playlist and Keynote takes over the output.
  slides.animations: The native PowerPoint importer keeps simple builds and transitions; emphasis and some other animations are not supported.
  outputs.lower_thirds: Separate key/fill outputs are available for broadcast graphics.
  songs.ccli_reporting: Songs triggered from presentations with a CCLI number can be auto-reported once SongSelect is signed in.
  songs.auto_import: Requires a SongSelect subscription and CCLI licence.
  songs.chords: Chord charts can be shown on stage screens (e.g. from Planning Center or MultiTracks).
  software_integrations.planning_center: Planning Center Services plans can be added as playlists; requires a separate Planning Center subscription.
  outputs.multiple: Up to 8 unique outputs; multiple computers can be linked with Network Link.
  automation.api: Public network API (OpenAPI spec) introduced in ProPresenter 7.9; older TCP/IP control also exists.
  automation.scripting: Macros run multi-step action sequences from a slide, a device or on demand.
  hardware.stream_deck: Official Elgato Stream Deck plugin since 7.9; Bitfocus Companion also has a ProPresenter module.
  sources.screen_share: AirCast (added in 18) receives AirPlay screens and audio as inputs.
  sources.web: Web pages can be shown as a web fill on slides.
  multilingual.side_by_side: Multiple translations can be shown on one slide using a theme with one text box per translation.
  streaming.rtmp: The Capture feature streams any output over RTMP, records it to disk, or both; Resi streaming is also supported.
  tv_output.apple_tv: Via ProDisplay (separate per-screen subscription), which runs on Apple TV and select Google TV devices.
  tv_output.android_tv: Via ProDisplay on select Google TV devices (separate per-screen subscription).
  connectivity.cloud_sync: ProPresenter Cloud syncs playlists, media and settings between machines.
  connectivity.collaboration: ProPresenter Cloud (beta in 22) lets others prepare playlists and make mid-service changes while an operator presents.
  connectivity.remote_control: ProPresenter Remote app is included with an active subscription.
