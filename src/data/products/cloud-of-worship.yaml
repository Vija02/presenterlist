name: Cloud of Worship
tagline: Free, minimalist browser-based presenter for lyrics, scripture and video.
description: >-
  Cloud of Worship is a free, minimalist, browser-based presentation tool for
  churches, developed by CoW Labs. It displays song lyrics, scriptures, videos
  and customizable slides, and is designed to work offline. Cloud features
  include a shared library of user-contributed worship songs, a real-time
  multiplayer mode for team collaboration and live content streaming over
  WebSocket. A Windows desktop app built with Tauri is also available; the
  source code is published on GitHub.
website: https://www.cloudofworship.com
developer: CoW Labs
headquarters: Nigeria
founded: 2024
status: active
open_source: false
