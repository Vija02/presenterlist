name: MediaShout
tagline: Church presentation software sold mainly as a one-time site licence.
description: >-
  MediaShout is a church presentation application for lyrics, scripture,
  sermon slides, announcements and media. MediaShout 7 includes 70 Bible
  translations, a song library with CCLI SongSelect import and automatic
  reporting, PowerPoint import and NDI input and output. It is primarily sold
  as a one-time site licence covering unlimited computers, with an optional
  yearly membership for support, training and media, and a lower-cost
  single-computer subscription edition (LE).
website: https://mediashout.com/
logo: /logos/mediashout.png
developer: MediaShout
headquarters: United States
status: active
open_source: false
pricing:
  models: [one_time, subscription]
  free_trial: true
  starting_price: $599 one-time (Windows site licence)
  pricing_url: https://mediashout.com/pricing
  notes: >-
    Windows site licence $599; Mac site licence $499. Essentials and Complete
    bundles add a first year of Plus membership ($199/year) and Shift Worship
    Media. MediaShout LE is a $198/year single-computer subscription without a
    stage display. 14-day fully functional trial.
platforms: [windows, macos]
deployment: [desktop]
output_note: >-
  The pricing page lists a Mac edition, but its product link refers to
  MediaShout 6, so feature parity of the Mac version with MediaShout 7 for
  Windows is unclear.
features:
  songs:
    library: true
    auto_import: true
    backgrounds: true
    ccli_reporting: true
  bible:
    builtin: true
    licensed: true
  slides:
    powerpoint: true
    animations: partial
  media:
    video: true
    audio: true
    images: true
  sources:
    camera: true
  multilingual:
    side_by_side: true
  outputs:
    multiple: true
    stage_display: true
    lower_thirds: true
  broadcast_video:
    ndi: true
  connectivity:
    remote_control: true
    web_native: false
feature_notes:
  songs.auto_import: Lyrics can be imported through the CCLI SongSelect integration.
  songs.ccli_reporting: Songs used are reported to CCLI automatically; listed for the Windows version.
  songs.backgrounds: Motion backgrounds are available, with Shift Worship Media included in the Complete bundle.
  bible.builtin: About 70 translations, including public-domain and copyrighted versions, are included with the licence.
  bible.licensed: Copyrighted translations are among the 70 included at no additional cost.
  multilingual.side_by_side: Dual Bible display can show two translations or languages on screen.
  slides.powerpoint: PowerPoint slides can be imported as images or as editable MediaShout cues.
  slides.animations: MediaShout's own slides support text animations and transitions; it is not stated that imported PowerPoint animations are kept.
  media.images: Unsplash and Pixabay images and videos can be searched and inserted from within the software.
  broadcast_video.ndi: Since version 7.4, NDI feeds can be shown in presentations and outputs can be sent over NDI.
  sources.camera: Live video feeds (cameras, phones, other apps) via NDI.
  outputs.multiple: Control screen, main display and an optional third output for stage/confidence or livestream.
  outputs.stage_display: Not included in the LE edition.
  outputs.lower_thirds: Lower-third templates are included.
  connectivity.remote_control: MediaShout Remote app for iOS (added in 7.3); standard USB presentation remotes also work.
docs_url: https://mediashout.com/docs/mediashout-7-user-guide/
