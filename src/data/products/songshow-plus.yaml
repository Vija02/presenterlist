name: SongShow Plus
tagline: Windows worship presentation software with edition-based licences and optional subscriptions.
description: >-
  SongShow Plus is a Windows presentation application from R-Technics for
  song lyrics, scripture, sermon slides and media. It is sold as a one-time
  licence (currently only the Ultra edition) with optional yearly
  subscriptions that add upgrades and integrations such as SongSelect,
  Planning Center Online and Shift Worship, plus cloud sync and a browser-based
  mobile control app. Version 9.3 added support for CCLI auto-reporting.
website: https://www.songshowplus.com/
logo: /logos/songshow-plus.png
developer: R-Technics, Inc.
status: active
open_source: false
pricing:
  models: [one_time, subscription]
  free_trial: true
  starting_price: $249 one-time (Ultra edition, special price)
  pricing_url: https://www.songshowplus.com/store
  notes: >-
    Ultra edition is listed at $249 (special price, normally $549), including
    the first year of the Bronze subscription. Basic and Pro editions are
    listed as unavailable. Yearly subscriptions: Bronze $180, Silver $240,
    Platinum $450. Each projection computer needs a projection licence (first
    included); Bible translations beyond ASV, KJV and WEB are $25 per
    plug-in per machine. A free evaluation copy is available.
platforms: [windows]
deployment: [desktop]
features:
  songs:
    library: true
    auto_import: addon
    backgrounds: true
    ccli_reporting: true
  bible:
    builtin: true
    licensed: addon
  slides:
    powerpoint: true
    animations: partial
  media:
    video: true
    audio: true
    images: true
    youtube: true
  sources:
    camera: true
    web: true
    timers: true
    messages: true
  software_integrations:
    planning_center: addon
  automation:
    ai: addon
  outputs:
    multiple: true
    stage_display: true
    lower_thirds: true
  broadcast_video:
    ndi: true
    sdi: true
  connectivity:
    cloud_sync: addon
    offline: true
    remote_control: addon
    collaboration: addon
    web_native: false
feature_notes:
  bible.builtin: ASV, KJV and WEB are included.
  bible.licensed: Translations such as NIV, ESV, NKJV and NLT are $25 plug-ins per machine.
  songs.auto_import: Requires the Bronze (or higher) subscription plus a separate SongSelect subscription.
  songs.ccli_reporting: CCLI auto-reporting added in version 9.3.
  songs.backgrounds: Motion backgrounds with real-time effects and rendered visualizations; Shift Worship media can be imported with a separate subscription.
  slides.powerpoint: PowerPoint presentations can be imported step by step, as images or as video files.
  slides.animations: Importing PowerPoint as video can keep animations; SongShow's own slides have transitions and animations.
  media.youtube: Web pages, including YouTube videos, can be presented.
  sources.camera: Live video (IMAG) with text and graphic overlays.
  sources.timers: Customizable countdown timers (Pro edition and above).
  sources.messages: Instant Message shows nursery alerts and other messages (Pro edition and above).
  software_integrations.planning_center: Requires the Bronze (or higher) subscription plus a Planning Center subscription.
  automation.ai: Optional image indexing with Microsoft/Azure Computer Vision requires the Silver subscription.
  outputs.multiple: Multi-display support (up to six display windows since 9.1) is part of the Ultra edition.
  outputs.stage_display: One or more customizable stage outputs are part of the Ultra edition.
  outputs.lower_thirds: Output windows can be configured as synchronized lower-third layouts.
  broadcast_video.ndi: NDI streaming (added in 9.1) is part of the Ultra edition.
  broadcast_video.sdi: Blackmagic DeckLink output can be assigned to any display window.
  connectivity.cloud_sync: SongShow Sync requires the Silver subscription.
  connectivity.remote_control: Mobile Control (a progressive web app) requires the Silver subscription.
  connectivity.collaboration: SongShow Drive media sharing and the web-based SongShow Builder require the Silver subscription.
release_notes_url: https://www.songshowplus.com/whatsnew
