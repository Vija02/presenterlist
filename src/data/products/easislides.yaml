name: EasiSlides
tagline: Free Windows song and Bible projection software with up to four outputs.
description: >-
  EasiSlides is a free, donation-supported worship projection program for
  Windows by Wai Kuen Mo; version 5 is published under the spelling
  "EasySlides" at easyslides.com. It projects song lyrics (optionally with
  chords or two languages), Bible passages, PowerPoint slides, images, video
  and audio from a schedule. Up to four outputs are supported, including a
  "detailed" output intended as a confidence monitor for musicians and
  speakers. Version 5.2 was released on 1 October 2026.
website: https://www.easyslides.com
developer: Wai Kuen Mo
status: active
open_source: false
pricing:
  models: [free, donation]
  free_trial: false
platforms: [windows]
deployment: [desktop]
features:
  songs:
    library: true
    import_other: true
    auto_import: partial
    chords: true
    backgrounds: true
    ccli_reporting: partial
  bible:
    builtin: true
  slides:
    powerpoint: true
  media:
    video: true
    audio: true
    images: true
  sources:
    camera: true
    timers: true
    messages: true
  multilingual:
    song_libraries: true
    bible_translations: true
    bilingual_display: true
    side_by_side: true
    non_latin: true
  outputs:
    multiple: true
    stage_display: true
  connectivity:
    offline: true
feature_notes:
  songs.import_other: Lyrics can be imported directly from OpenSong and OpenLP.
  songs.auto_import: Imports SongSelect lyrics in text format; no direct online connection.
  songs.chords: Guitar chords and other notations can be added to lyrics and shown on the detailed output.
  songs.backgrounds: Audio, video or a live camera can play as a background with text overlay.
  songs.ccli_reporting: Collates song usage for CCLI reporting; submission is manual.
  bible.builtin: Uses MyBible (SQLite) and Zefania format Bibles; KJV and Chinese Union versions have shipped by default.
  slides.powerpoint: Integrates PowerPoint slides; Microsoft PowerPoint must be installed.
  sources.camera: A video camera or webcam feed can be used as a background behind text.
  sources.timers: Clock showing the time or a countdown to the start of the service.
  sources.messages: Subtitle alerts and full-screen ad-hoc messages.
  multilingual.bilingual_display: Lyrics and texts can be projected in two languages at the same time; widely used by bilingual Chinese churches.
  multilingual.side_by_side: Two Bible versions can be shown at once.
  multilingual.non_latin: Chinese text is supported, including Traditional/Simplified conversion.
  outputs.multiple: Up to four outputs (main, subtitle and detailed outputs); live output can also be multicast to Windows PCs on the LAN.
  outputs.stage_display: The "detailed" output shows chords, schedule, next item and operator messages for musicians and speakers.
