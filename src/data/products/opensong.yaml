  - https://sourceforge.net/projects/opensong/
  - https://sourceforge.net/projects/opensong/files/
  - https://sourceforge.net/p/opensong/code/HEAD/tree/
  - https://sourceforge.net/p/opensong/code/HEAD/tree/source/trunk/changelog.txt
last_verified: 2026-11-04
