feature_notes:
  songs.library: Bundled databases of 3,000+ Malayalam songs (with transliteration), 1,000+ Hindi songs and lyrics in Tamil, Telugu, Kannada, Bengali, Arabic, Spanish and Russian.
  songs.import_text: Pasted lyrics are split into slides by blank lines.
  songs.chords: Chords with transposition and a number system were added in VerseVIEW 10.1 to 10.3.
  songs.backgrounds: A video background ships with the installation.
  bible.builtin: Bible databases in 40+ languages; Zefania XML Bibles can be imported.
  multilingual.side_by_side: Verses can be shown in primary and secondary languages at once.
  multilingual.non_latin: Unicode Malayalam, Hindi, Tamil, Telugu, Arabic and Khmer texts are available.
  media.video: Video and still media playback was added in VerseVIEW 10.
  outputs.lower_thirds: An additional lower-third output can be layered in OBS or fed to video mixers; lower-third themes can also be served over the network.
  outputs.multiple: Main presentation plus stage view, AUX screen and lower-third outputs.
  connectivity.remote_control: Any device with a web browser can control Bible and scheduled song presentation.
