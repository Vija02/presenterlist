feature_notes:
  songs.library: Song database of 10,000+ songs from Dutch songbooks, shown as text or sheet music; billed €1 per songbook used each month.
  songs.ccli_reporting: CCLI Auto Reporting is not available, so songs must be reported to CCLI manually.
  bible.builtin: 11 Dutch and regional-language translations, including the public-domain Statenvertaling; each translation used costs €1 per month.
  bible.licensed: Copyrighted translations such as NBV21, Herziene Statenvertaling and Bijbel in Gewone Taal are included, with no separate licence needed.
  slides.powerpoint: .ppt/.pptx files are uploaded and converted; they cannot be edited in KerkBeamer and can loop with a set time per slide.
  media.video: Uploaded videos are converted to MP4 and can be trimmed.
  media.youtube: The documentation states YouTube videos or URLs cannot be added.
  sources.camera: The paid TV broadcasts add-on (or the separate CameraRegie product) controls PTZ cameras and a Blackmagic ATEM switcher, so camera images can be put on the projector.
  sources.interaction: The paid LiveBeamer add-on lets people follow the presentation on their own phone, tablet or laptop via a URL.
  multilingual.ui: The interface and documentation are Dutch only.
  multilingual.bible_translations: Translations include Frisian, Twents and Gronings as well as standard Dutch.
  automation.ai: Live sermon captions from speech recognition can be shown through an integration with Preekondertiteling.nl, which needs its own subscription.
  outputs.multiple: Extra outputs for a church TV broadcast can be driven alongside the projector output.
  outputs.lower_thirds: The paid TV broadcasts add-on provides subtitles and text-over-video using a separate alpha (key) output or chroma key.
  outputs.web_output: The paid LiveBeamer add-on shows the live presentation as a web page on any device.
  connectivity.offline: Presentations are stored online and must be loaded over the internet; once loaded they play without a connection.
  connectivity.collaboration: Team members can work on presentations and templates at the same time.
  connectivity.web_native: Presentations are prepared in the browser, but playback in church uses the KerkBeamer software for Windows or macOS.
