name: KerkBeamer
tagline: Dutch online service for building church beamer presentations from a song and Bible database.
description: >-
  KerkBeamer is a Dutch-language online service for preparing church service
  presentations for projectors and church TV screens. Presentations are built
  online from a database of more than 10,000 songs (as text or sheet music) and
  11 Bible translations, with reusable service parts and team collaboration.
  Paid add-ons cover kerkTV broadcasting, LiveBeamer (following the
  presentation on any device via a URL) and CameraRegie camera control.
website: https://kerkbeamer.nl
